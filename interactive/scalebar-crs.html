/* Shared look of the interactive tools, after the UGent house style (ugent.be sites such as medievalmodern.ugent.be):
   UGent blue, light blue panels, yellow action buttons, square corners, one font for everyone: Assistant (SIL OFL, inlined by build.py), headings in sentence case (author, 2026-10-29). */
:root {
  --ug-blue: #1e64c8; --ug-blue-dark: #174e9c; --ug-blue-light: #e9f0fa; --ug-yellow: #ffd200;
  --bg: #f4f7fc; --panel: #ffffff; --ink: #202020; --muted: #5b6573; --line: #c9d7ee;
  --font: "Assistant", Arial, Helvetica, sans-serif;
  --font-medium: "Assistant SemiBold", "Assistant", Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
#app { display: flex; height: 100%; }
#view { flex: 1; position: relative; min-width: 0; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
#view canvas { display: block; }
#hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--muted); pointer-events: none; }
#panel { width: 330px; flex: none; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
#panel > header { background: var(--ug-blue); color: #fff; padding: 18px 18px 16px; }
#panel > header h1 { margin: 0; font: 22px/1.15 var(--font-medium); }
#panel > header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
#panel > header { flex: none; }
#panel > .body { padding: 4px 18px 16px; flex: 1 0 auto; display: flex; flex-direction: column; }
h2 { font: 14px/1.2 var(--font-medium); color: var(--ug-blue); margin: 18px 0 7px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .row button { font: 15px/1.25 var(--font); padding: 7px 10px; border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; }
.seg button { flex: 1 1 auto; }
.seg button:hover, .row button:hover { background: var(--ug-blue-light); }
.seg button.on { background: var(--ug-blue); color: #fff; }
.seg.col { flex-direction: column; }
.seg.col button { text-align: left; }
.row { display: flex; align-items: center; gap: 10px; }
.row button.play { background: var(--ug-yellow); border-color: var(--ug-yellow); color: var(--ug-blue-dark); font-family: var(--font-medium); padding: 7px 16px; }
.row button.play:hover { background: #ffe14d; }
input[type=range] { width: 100%; accent-color: var(--ug-blue); }
input[type=checkbox] { accent-color: var(--ug-blue); }
label.chk, div.chk { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 15px; cursor: pointer; }
.chk .sw { display: inline-block; width: 18px; height: 4px; }
.chk.sel { font-family: var(--font-medium); color: var(--ug-blue); }
.val { font-size: 14px; color: var(--muted); }
#info { margin-top: 20px; background: var(--ug-blue-light); border-top: 4px solid var(--ug-blue); padding: 12px 14px; }
#info b { display: block; font: 17px/1.25 var(--font-medium); color: var(--ug-blue); margin-bottom: 5px; }
#info p { margin: 0; font-size: 14.5px; }
#info p + p { margin-top: 6px; }
#info table { font-size: 13.5px; border-collapse: collapse; margin-top: 4px; }
#info td { padding: 1px 10px 1px 0; vertical-align: top; }
.credit { margin-top: auto; margin-bottom: 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.body > .credit { margin-top: auto; } .body > :nth-last-child(2) { margin-bottom: 22px; }
.note, .legend { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

}

// --- panel ---
function infoText() {
  const k = state.crs, n = nameOf(k), t = `${n[0]}, ${n[1]}`;
  if (k === "3857") return [t,
    `The scale grows towards the poles. A scale bar can only fit a narrow band of latitude.`];
  if (k === "4326") return [t,
    `The map units are degrees. For a bar in km, QGIS measures the map width on the ellipsoid. On the ground a degree of longitude gets shorter towards the poles, but on this map it does not. So the <span class="nw">east–west</span> scale changes with the latitude.`];
  if (k === "utm") return [t,
    `UTM zone 31N is made for the zone from 0° to 6°&nbsp;E, where its scale error stays minimal. Away from the zone it grows quickly.`];
  if (k === "31370") return [t,
    `Lambert 72 is made for Belgium, where its scale error stays minimal. Further north and south, it grows.`];
  return [t,
    `This equal-area CRS is made for Europe. Areas stay true, but away from Europe, shapes and distances get heavily distorted.`];
}
function updatePanel() {
  const world = state.reg === "world";
  const extEl = document.getElementById("ext");
  extEl.innerHTML = Object.entries(REGIONS).map(([k, r]) => `<button data-k="${k}"${k === state.reg ? ' class="on"' : ""}>${r.name}</button>`).join("");
  // extents stay clickable: a CRS that does not fit the world map switches to its default
  extEl.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.k !== state.reg) { state.reg = b.dataset.k; if (state.reg === "world" && !WORLD_KEYS.includes(state.crs)) state.crs = "3857"; [state.lat, state.lon] = REGIONS[state.reg].home; init(); } refresh(); });
  const crsEl = document.getElementById("crs");
  crsEl.innerHTML = KEYS.map(k => { const n = nameOf(k); const off = world && !WORLD_KEYS.includes(k); return `<button data-k="${k}" title="${off ? "Not for a world map: made for a smaller area" : `${n[2]}, ${n[1]}`}"${k === state.crs ? ' class="on"' : ""}${off ? " disabled" : ""}>${n[0]}<small>${n[1]}</small></button>`; }).join("");
  crsEl.querySelectorAll("button").forEach(b => b.onclick = () => { state.crs = b.dataset.k; if (state.calc === "eq" && !EQ_KEYS.includes(state.crs)) state.calc = "mid"; init(); refresh(); });
  const calcEl = document.getElementById("calc");
  calcEl.innerHTML = METHODS.map(m => `<button data-k="${m.k}"${m.k === state.calc ? ' class="on"' : ""}${m.k === "eq" && !EQ_KEYS.includes(state.crs) ? ' disabled title="Not in this CRS: the equator is not a straight line across the map"' : ""}>${m.name}${m.note ? `<small>${m.note}</small>` : ""}</button>`).join("");
  calcEl.querySelectorAll("button").forEach(b => b.onclick = () => { state.calc = b.dataset.k; computeRuler(); refresh(); });
  const w = S.widths;   // compact table (author, 2026-10-30): the row of the chosen method in bold
  // top, middle and bottom side by side with their values under them (author), then average and equator as rows
  const on = k => k === state.calc ? ' class="on"' : "";
  const row = (k, label, v) => `<tr${k === state.calc ? ' class="main"' : ""}><td colspan="3">${label}</td><td>${kmTxt(v)}</td></tr>`;
  const av = (w.top + w.mid + w.bot) / 3, onA = state.calc === "avg" ? ' class="avg on"' : ' class="avg"';   // average as a fourth column, after a line (author)
  document.getElementById("wid").innerHTML =
    `<tr class="tmb"><td>Top</td><td${on("mid")}>Middle</td><td>Bottom</td><td${onA}>Average</td></tr>` +
    `<tr class="tmb v"><td>${kmTxt(w.top)}</td><td${on("mid")}>${kmTxt(w.mid)}</td><td>${kmTxt(w.bot)}</td><td${onA}>${kmTxt(av)}</td></tr>` +
    (w.eq === null ? "" : `<tr${state.calc === "eq" ? ' class="main"' : ""}><td colspan="4" class="eqrow">Along the equator: ${kmTxt(w.eq)}</td></tr>`);
  document.getElementById("attn").hidden = !world;
  document.getElementById("attn").innerHTML = world
    ? `<b class="attnt">Scale bars are useless on world maps</b>To determine the length of the scale bar, QGIS takes the points at the far left and far right of the map frame and calculates the shortest route between them. On a world map, however, the left and right edges meet on the globe. So QGIS measures only a narrow gap, if any, and the scale bar is useless.`
    : "";   // only on the world map (author: for Belgium and Europe the buttons and the width table show it);
  updateResult();
  const [t, ...ps] = infoText();
  document.getElementById("info").innerHTML = `<b>${t}</b>` + ps.map(p => `<p>${p}</p>`).join("");
  document.getElementById("band").checked = state.band;
}
function updateResult() {
  document.getElementById("at").innerHTML = `At the ruler <svg class="xmark" width="7" height="7" viewBox="0 0 7 7"><path d="M1 1L6 6M6 1L1 6" stroke="#d62828" stroke-width="1.6" stroke-linecap="round"/></svg>: ${deg(state.lat, "N", "S")}, ${deg(state.lon, "E", "W")}`;   // the red cross of the map (author)
  const geo = state.crs === "4326", keyEl = document.getElementById("key");
  if (!cal.k) { document.getElementById("res").innerHTML = `<tr><td>No scale bar, so nothing to compare</td></tr>`; keyEl.innerHTML = ""; return; }
  const D = cal.D, r = ruler.ratio, err = (r - 1) * 100, m = D * r;
  // three columns as in the width table (author): what the bar claims, what it is here, the error; the whole map on a line under it
  const mk = m < 10 ? m.toFixed(1) : group(String(Math.round(m)));
  document.getElementById("res").innerHTML =
    `<tr class="tmb"><td>Scale bar claims</td><td>Really here</td><td>Error</td></tr>` +
    `<tr class="tmb v"><td>${fmtKm(D)}&nbsp;km</td><td class="b">${mk}&nbsp;km</td><td class="b e ${Math.abs(err) < BAND ? "ok" : "bad"}">${pct(err)}</td></tr>` +
    `<tr><td colspan="3" class="eqrow">Error on the whole map: ${pct((S.lo / cal.k - 1) * 100)} to ${S.hi === Infinity ? "+∞ (poles)" : pct((S.hi / cal.k - 1) * 100)}</td></tr>`;
  keyEl.innerHTML = "";   // k rows and their key removed (author: same as the measured row)
}
function setHint() {
  // how the tool works: here, under the map, as in the other tools (the panel keeps what is about QGIS and the CRS)
  if (state.drag) { hint.textContent = "Drop the ruler anywhere on the map"; return; }
  const t = ["Drag the ruler or click the map to move it."];   // short, as in the 5.3 tools (author, 2026-10-30)
  hint.textContent = t.join(" ");
}
function writeHash() {
  let h = `map=${state.reg}&crs=${state.crs}&calc=${state.calc}&lat=${state.lat.toFixed(2)}&lon=${state.lon.toFixed(2)}`;
  if (state.crs === "utm" && state.zone !== 31) h += `&zone=${state.zone}`;
  if (!state.band) h += "&band=0";
  if (BAND !== 1) h += `&tol=${BAND}`;
  try { history.replaceState(null, "", "#" + h); } catch (e) { /* not allowed in some embeds */ }
}
function refresh() { updatePanel(); draw(); setHint(); writeHash(); }
document.getElementById("band").onchange = e => { state.band = e.target.checked; draw(); writeHash(); };
function updateTol() { document.querySelectorAll("#tol button").forEach(b => b.classList.toggle("on", +b.dataset.k === BAND)); }
document.querySelectorAll("#tol button").forEach(b => b.onclick = () => { BAND = +b.dataset.k; state.band = true; updateTol(); refresh(); });
updateTol();

// --- mouse: drag the ruler, or click the map to move it ---
function mapXY(e) { const r = view.getBoundingClientRect(); return [S.ext.x0 + (e.clientX - r.left - box.x) / box.k, S.ext.y1 - (e.clientY - r.top - box.y) / box.k]; }
function screenXY(e) { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function segDist([px, py], [ax, ay], [bx, by]) { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1))); return Math.hypot(px - ax - t * dx, py - ay - t * dy); }
function onRuler(e) {
  const p = screenXY(e), c = [X(ruler.c[0]), Y(ruler.c[1])];
  if (rulerBox && p[0] >= rulerBox[0] && p[0] <= rulerBox[2] && p[1] >= rulerBox[1] && p[1] <= rulerBox[3]) return true;
  if (Math.hypot(p[0] - c[0], p[1] - c[1]) < 14) return true;
  if (!cal.k) return false;
  const barPx = cal.D * 1000 * cal.k * box.k, by = c[1] - 12.5;
  return segDist(p, [X(ruler.a[0]), Y(ruler.a[1])], [X(ruler.b[0]), Y(ruler.b[1])]) < 9 ||
    segDist(p, [c[0] - barPx / 2, by], [c[0] + barPx / 2, by]) < 9;
}
const onMap = ([x, y]) => x >= S.ext.x0 && x <= S.ext.x1 && y >= S.ext.y0 && y <= S.ext.y1;
function moveTo(x, y) {
  const e = S.ext, m = (e.x1 - e.x0) * 0.002;
  x = Math.max(e.x0 + m, Math.min(e.x1 - m, x)); y = Math.max(e.y0 + m, Math.min(e.y1 - m, y));
  const [lon, lat] = S.inv(x, y);
  return place(lon, lat);
}
view.addEventListener("pointerdown", e => {
  const p = mapXY(e);
  state.down = { x: e.clientX, y: e.clientY };
  if (onRuler(e)) { state.drag = { p, c: ruler.c.slice(), moved: false }; view.setPointerCapture(e.pointerId); view.classList.add("dragging"); }
});
view.addEventListener("pointermove", e => {
  if (state.drag) {
    const dr = state.drag, p = mapXY(e);
    if (Math.hypot(e.clientX - state.down.x, e.clientY - state.down.y) > 3) dr.moved = true;
    if (!dr.moved) return;
    if (moveTo(dr.c[0] + p[0] - dr.p[0], dr.c[1] + p[1] - dr.p[1])) { updateResult(); draw(); }
    setHint(); return;
  }
  view.classList.toggle("over-ruler", onRuler(e));
});
view.addEventListener("pointerup", e => {
  const dr = state.drag, p = mapXY(e);
  state.drag = null; view.classList.remove("dragging");
  if (!dr && state.down && Math.hypot(e.clientX - state.down.x, e.clientY - state.down.y) <= 3 && onMap(p)) moveTo(p[0], p[1]);
  state.down = null; refresh();
});
window.addEventListener("hashchange", () => { readHash(new URLSearchParams(location.hash.slice(1))); init(); updatePanel(); draw(); setHint(); });
let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(view);
refresh();
</script>
</body>
</html>
