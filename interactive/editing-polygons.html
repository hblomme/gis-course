/* Shared look of the interactive tools, after the UGent house style (ugent.be sites such as medievalmodern.ugent.be):
   UGent blue, light blue panels, yellow action buttons, square corners, one font for everyone: Assistant (SIL OFL, inlined by build.py), headings in sentence case (author, 2026-10-29). */
:root {
  --ug-blue: #1e64c8; --ug-blue-dark: #174e9c; --ug-blue-light: #e9f0fa; --ug-yellow: #ffd200;
  --bg: #f4f7fc; --panel: #ffffff; --ink: #202020; --muted: #5b6573; --line: #c9d7ee;
  --font: "Assistant", Arial, Helvetica, sans-serif;
  --font-medium: "Assistant SemiBold", "Assistant", Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
#app { display: flex; height: 100%; }
#view { flex: 1; position: relative; min-width: 0; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
#view canvas { display: block; }
#hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--muted); pointer-events: none; }
#panel { width: 330px; flex: none; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
#panel > header { background: var(--ug-blue); color: #fff; padding: 18px 18px 16px; }
#panel > header h1 { margin: 0; font: 22px/1.15 var(--font-medium); }
#panel > header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
#panel > header { flex: none; }
#panel > .body { padding: 4px 18px 16px; flex: 1 0 auto; display: flex; flex-direction: column; }
h2 { font: 14px/1.2 var(--font-medium); color: var(--ug-blue); margin: 18px 0 7px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .row button { font: 15px/1.25 var(--font); padding: 7px 10px; border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; }
.seg button { flex: 1 1 auto; }
.seg button:hover, .row button:hover { background: var(--ug-blue-light); }
.seg button.on { background: var(--ug-blue); color: #fff; }
.seg.col { flex-direction: column; }
.seg.col button { text-align: left; }
.row { display: flex; align-items: center; gap: 10px; }
.row button.play { background: var(--ug-yellow); border-color: var(--ug-yellow); color: var(--ug-blue-dark); font-family: var(--font-medium); padding: 7px 16px; }
.row button.play:hover { background: #ffe14d; }
input[type=range] { width: 100%; accent-color: var(--ug-blue); }
input[type=checkbox] { accent-color: var(--ug-blue); }
label.chk, div.chk { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 15px; cursor: pointer; }
.chk .sw { display: inline-block; width: 18px; height: 4px; }
.chk.sel { font-family: var(--font-medium); color: var(--ug-blue); }
.val { font-size: 14px; color: var(--muted); }
#info { margin-top: 20px; background: var(--ug-blue-light); border-top: 4px solid var(--ug-blue); padding: 12px 14px; }
#info b { display: block; font: 17px/1.25 var(--font-medium); color: var(--ug-blue); margin-bottom: 5px; }
#info p { margin: 0; font-size: 14.5px; }
#info p + p { margin-top: 6px; }
#info table { font-size: 13.5px; border-collapse: collapse; margin-top: 4px; }
#info td { padding: 1px 10px 1px 0; vertical-align: top; }
.credit { margin-top: auto; margin-bottom: 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.body > .credit { margin-top: auto; } .body > :nth-last-child(2) { margin-bottom: 22px; }
.note, .legend { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

    const b = r[(i + 1) % r.length], [ax, ay] = scr(a), [bx, by] = scr(b), dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;

// ===== editing =====
let lastSnap = null;

function addVertex(sn, p) {

}
function finish() {

  let mp = [[state.draw.map(q => q.slice())]];

// avoid overlap on a layer of type Polygon (single part): QGIS keeps only the largest piece (tested in QGIS 4.2.3,

// move (author, 2026-11-24): click a feature to pick it up, move the mouse, click again to drop it, as Move Feature in QGIS.
// With avoid overlap, QGIS cuts the moved feature where it lands on other features (QgsAvoidIntersectionsOperation).
const shift = (f, dx, dy) => ({ ...f, parts: f.parts.map(p => p.map(r => r.map(q => [q[0] + dx, q[1] + dy]))) });

  const i = state.move.i, moved = shift(state.feats[i], dx, dy);
  state.msg = null;
  let mp = moved.parts;
  if (state.avoid) {
    const others = state.feats.filter((_, k) => k !== i).map(f => f.parts.map(p => p.map(r => r.map(q => q.slice()))));
    try { mp = others.length ? fromPC(PC.difference(mp.map(p => p.map(r => r.map(q => q.slice()))), ...others)) : mp; } catch (e) { mp = []; }
    if (!mp.length || mp.reduce((s, p) => s + partArea(p), 0) < 0.5) {

    }

// ===== drawing =====
function polyPath(f) {
  g.beginPath();
  for (const p of f.parts) for (const r of p) { r.forEach((q, i) => { const [x, y] = scr(q); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); }
}
function draw() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = mapbox.clientWidth, h = mapbox.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + "px"; cv.style.height = h + "px"; }

  g.fillStyle = "#fbfbf8"; const [ax, ay] = scr([EXT.x0, EXT.y1]); g.fillRect(ax, ay, (EXT.x1 - EXT.x0) * K, (EXT.y1 - EXT.y0) * K);

    g.lineJoin = "round"; g.strokeStyle = i === state.sel ? "#c9a800" : "#4a7a3a"; g.lineWidth = 1.4; g.stroke();

// ===== panel and table =====
const INFO = {
  select: ["Select Features", "Click a polygon or a row in the attribute table to select it. Many editing tools work on the selected features, such as Delete Selected."],
  move: ["Move Feature", "Click a polygon to pick it up, move the mouse and click again to drop it. Try it with avoid overlap: QGIS cuts the moved polygon where it lands on others."],
  add: ["Add Polygon Feature", "Click to add vertices, right-click to finish."],
  snap: ["Snapping", "A new vertex jumps to a vertex or segment of another polygon within 12 pixels. That way neighbouring polygons share their border exactly."],
  trace: ["Tracing", "Click two points on polygon borders: QGIS follows the borders between them along the shortest way, also across neighbouring polygons."],
  avoid: ["Avoid overlap", "QGIS cuts a new or moved polygon where it overlaps existing polygons. You can draw roughly over a neighbour: the shared border follows the neighbour exactly. If a polygon is cut into pieces, QGIS keeps only the largest one on a layer of type Polygon, and all of them as one feature on a MultiPolygon layer."],
};
let infoKey = "add";
function updatePanel() {
  const te = document.getElementById("tools"); te.innerHTML = "";
  for (const [k, l, s] of [["add", "Add Polygon Feature", ""], ["move", "Move Feature", ""]]) {
    const b = document.createElement("button"); if (k === state.tool) b.className = "on"; b.textContent = l;
    b.onclick = () => { state.tool = k; state.draw = []; state.move = null; lastSnap = null; infoKey = k; refresh(); }; te.appendChild(b);
  }
  document.getElementById("c-snap").checked = state.snap;
  document.getElementById("c-trace").checked = state.trace;
  document.getElementById("c-avoid").checked = state.avoid;
  document.getElementById("c-trace").disabled = !state.snap;
  document.getElementById("c-trace").parentElement.title = state.snap ? "" : "Tracing uses snapping: switch snapping on first";
  document.getElementById("b-undo").disabled = !state.undo.length;
  const attn = document.getElementById("attn");
  attn.hidden = !state.msg; attn.innerHTML = state.msg ? `<b class="attnt">${state.msg[0]}</b>${state.msg[1]}` : "";
  const [ti, tx] = INFO[infoKey]; document.getElementById("info").innerHTML = `<b>${ti}</b><p>${tx}</p>`;
  // attribute table: the two fields, then what the geometry looks like (not fields in QGIS)
  const fmt = v => Math.round(v).toLocaleString("en-GB").replace(/,/g, " ");
  let html = `<thead><tr><th class="rn"></th><th>fid</th><th class="geo first">Parts</th><th class="geo">Multipart</th><th class="geo">Area (m²)</th></tr></thead><tbody>`;
  state.feats.forEach((f, i) => {
    html += `<tr data-i="${i}" class="${i === state.sel ? "sel" : ""} ${f.fid === state.newFid ? "new" : ""}"><td class="rn">${i + 1}</td><td class="n">${f.fid}</td>` +
      `<td class="geo first n">${f.parts.length}</td><td class="geo">${f.parts.length > 1 ? "yes" : "no"}</td><td class="geo n">${fmt(featArea(f))}</td></tr>`;
  });
  html += "</tbody>";

  t.innerHTML = html;
  t.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => { const i = +tr.dataset.i; state.sel = state.sel === i ? -1 : i; refresh(); });
  document.getElementById("nfeat").textContent = `${state.feats.length} features`;
}
function setHint() {

  hint.textContent = state.draw.length ? "Click to add a vertex · right-click to finish · Backspace removes the last vertex · Esc cancels" : "Click to start a new polygon";
}
function refresh() { updatePanel(); setHint(); draw(); }

// ===== mouse and keys =====
const local = e => { const r = mapbox.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
mapbox.addEventListener("pointermove", e => {
  const [sx, sy] = local(e); state.mouse = [sx, sy];
  if (state.tool === "move") { mapbox.style.cursor = state.move ? "move" : "default"; draw(); return; }
  if (state.tool !== "add") { state.cursor = null; state.hover = null; draw(); return; }
  state.hover = snapAt(sx, sy); state.cursor = state.hover ? state.hover.p : unscr(sx, sy);
  mapbox.style.cursor = "crosshair"; draw();
});
mapbox.addEventListener("pointerleave", () => { state.mouse = null; state.cursor = null; state.hover = null; draw(); });
mapbox.addEventListener("contextmenu", e => e.preventDefault());
mapbox.addEventListener("pointerdown", e => {
  const [sx, sy] = local(e);
  if (state.tool === "move") {
    if (e.button !== 0) return;
    const p = unscr(sx, sy);
    if (state.move) { drop(p[0] - state.move.p[0], p[1] - state.move.p[1]); return; }
    let hit = -1; for (let i = state.feats.length - 1; i >= 0; i--) if (inFeat(p, state.feats[i])) { hit = i; break; }
    if (hit >= 0) { state.move = { i: hit, p }; state.sel = hit; state.msg = null; refresh(); }
    return;
  }
  if (state.tool === "select") {
    if (e.button !== 0) return;
    const p = unscr(sx, sy); let hit = -1; for (let i = state.feats.length - 1; i >= 0; i--) if (inFeat(p, state.feats[i])) { hit = i; break; }
    state.sel = hit; refresh(); return;
  }
  if (e.button === 2) { finish(); return; }
  if (e.button !== 0) return;
  const sn = snapAt(sx, sy), p = sn ? sn.p : unscr(sx, sy);
  if (sn && sn.kind === "d" && sn.pos === 0 && state.draw.length >= 3) { finish(); return; }   // click on the first vertex: close
  state.msg = null; if (!state.draw.length) state.sel = -1;
  addVertex(sn, p); refresh();
});
window.addEventListener("keydown", e => {
  if (state.tool === "move" && e.key === "Escape") { state.move = null; refresh(); return; }
  if (state.tool !== "add") return;
  if (e.key === "Escape") { state.draw = []; lastSnap = null; refresh(); }
  if ((e.key === "Backspace" || e.key === "Delete") && state.draw.length) { e.preventDefault(); state.draw.pop(); lastSnap = null; refresh(); }
  if (e.key === "Enter") finish();

for (const [id, k] of [["c-snap", "snap"], ["c-trace", "trace"], ["c-avoid", "avoid"]]) {
  document.getElementById(id).onchange = ev => { state[k] = ev.target.checked; if (k === "snap" && !state.snap) state.trace = false; infoKey = k; refresh(); };
}

refresh();
</script>
