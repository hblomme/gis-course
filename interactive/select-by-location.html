/* Shared look of the interactive tools, after the UGent house style (ugent.be sites such as medievalmodern.ugent.be):
   UGent blue, light blue panels, yellow action buttons, square corners, one font for everyone: Assistant (SIL OFL, inlined by build.py), headings in sentence case (author, 2026-10-29). */
:root {
  --ug-blue: #1e64c8; --ug-blue-dark: #174e9c; --ug-blue-light: #e9f0fa; --ug-yellow: #ffd200;
  --bg: #f4f7fc; --panel: #ffffff; --ink: #202020; --muted: #5b6573; --line: #c9d7ee;
  --font: "Assistant", Arial, Helvetica, sans-serif;
  --font-medium: "Assistant SemiBold", "Assistant", Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
#app { display: flex; height: 100%; }
#view { flex: 1; position: relative; min-width: 0; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
#view canvas { display: block; }
#hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--muted); pointer-events: none; }
#panel { width: 330px; flex: none; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
#panel > header { background: var(--ug-blue); color: #fff; padding: 18px 18px 16px; }
#panel > header h1 { margin: 0; font: 22px/1.15 var(--font-medium); }
#panel > header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
#panel > header { flex: none; }
#panel > .body { padding: 4px 18px 16px; flex: 1 0 auto; display: flex; flex-direction: column; }
h2 { font: 14px/1.2 var(--font-medium); color: var(--ug-blue); margin: 18px 0 7px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .row button { font: 15px/1.25 var(--font); padding: 7px 10px; border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; }
.seg button { flex: 1 1 auto; }
.seg button:hover, .row button:hover { background: var(--ug-blue-light); }
.seg button.on { background: var(--ug-blue); color: #fff; }
.seg.col { flex-direction: column; }
.seg.col button { text-align: left; }
.row { display: flex; align-items: center; gap: 10px; }
.row button.play { background: var(--ug-yellow); border-color: var(--ug-yellow); color: var(--ug-blue-dark); font-family: var(--font-medium); padding: 7px 16px; }
.row button.play:hover { background: #ffe14d; }
input[type=range] { width: 100%; accent-color: var(--ug-blue); }
input[type=checkbox] { accent-color: var(--ug-blue); }
label.chk, div.chk { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 15px; cursor: pointer; }
.chk .sw { display: inline-block; width: 18px; height: 4px; }
.chk.sel { font-family: var(--font-medium); color: var(--ug-blue); }
.val { font-size: 14px; color: var(--muted); }
#info { margin-top: 20px; background: var(--ug-blue-light); border-top: 4px solid var(--ug-blue); padding: 12px 14px; }
#info b { display: block; font: 17px/1.25 var(--font-medium); color: var(--ug-blue); margin-bottom: 5px; }
#info p { margin: 0; font-size: 14.5px; }
#info p + p { margin-top: 6px; }
#info table { font-size: 13.5px; border-collapse: collapse; margin-top: 4px; }
#info td { padding: 1px 10px 1px 0; vertical-align: top; }
.credit { margin-top: auto; margin-bottom: 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.body > .credit { margin-top: auto; } .body > :nth-last-child(2) { margin-bottom: 22px; }
.note, .legend { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  #app { flex-direction: column; }
  #view { flex: 1 1 55%; }
  #panel { width: auto; flex: 1 1 45%; border-left: 0; border-top: 1px solid var(--line); }
}
#panel > .body > .seg:first-child { margin-top: 16px; }
</style>
<style>
  #panel { width: 370px; }   /* house style (STYLE-TOOLS.md) */
  #panel > .body { padding: 4px 16px 14px; }
  @media (max-width: 760px) { #panel { width: auto; } }
  #view { cursor: default; }
  #view.zoomed { cursor: grab; }
  #view.over-state { cursor: move; }
  #view.over-feature { cursor: pointer; }
  #view.dragging { cursor: grabbing; }
  #view canvas { position: absolute; left: 0; top: 0; }
  #hint { font-size: 13px; color: var(--muted); }
  #panel > header { padding: 14px 18px 12px; }
  h2 { margin: 16px 0 6px; }
  .body > :nth-last-child(2) { margin-bottom: 12px; }
  /* layer buttons as the main choice buttons of the reference tools (overview-extent, scalebar-crs) */
  #layers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 2px; }
  #layers button { display: flex; flex-direction: column; align-items: center; font: 15px/1.25 var(--font); padding: 8px 9px; border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; text-align: center; }
  #layers button small { display: block; font: 11px/1.2 var(--font); color: var(--muted); margin-top: 2px; }
  #layers button:hover { background: var(--ug-blue-light); }
  #layers button.on { background: var(--ug-blue); color: #fff; }
  #layers button.on small { color: #dce7f7; }
  #preds { border-collapse: collapse; width: 100%; font-size: 15px; }
  #preds th { font: 12px/1.2 var(--font); color: var(--muted); text-align: center; padding: 0 2px 3px; vertical-align: bottom; }
  #preds td { padding: 0; height: 24px; }
  #preds th.gp { text-align: left; padding-left: 0; }
  #preds th.cap { text-align: right; padding: 0 2px 3px; color: var(--muted); }
  #preds th.cap .gpl { float: left; }
  #preds td.t { text-align: center; font-size: 14px; width: 82px; }
  #preds td.t.yes { font-family: var(--font-medium); font-weight: 700; color: var(--ug-blue); }
  #preds td.t.no { color: #9aa3b0; }
  /* no yellow for the ticked predicate that is true (author 2026-11-16: confusing next to the yellow selection) */
  #preds label.chk { margin: 0; font-size: 15px; }
  #preds tr + tr td { border-top: 1px solid #edf1f8; }
  /* one or two areas: main choice buttons as the layer buttons, Reset position beside them */
  #cmp { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 2px; }
  #cmp button { font: 15px/1.25 var(--font); padding: 8px 9px; border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; text-align: center; }
  #cmp button:hover { background: var(--ug-blue-light); }
  #cmp button.on { background: var(--ug-blue); color: #fff; }
  #cmp button:disabled { opacity: .4; cursor: default; background: #fff; }
  #count { margin-top: 12px; font-size: 15px; }
  #count b { font-family: var(--font-medium); color: var(--ug-blue); }
  #info { margin-top: 10px; padding: 8px 12px; }
  #info b { font-size: 16px; margin-bottom: 3px; }
  #info p { font-size: 14px; line-height: 1.35; }
  .attn .attnt { display: block; font-family: var(--font-medium); font-weight: normal; font-size: 15px; margin-bottom: 3px; }
  .attn { margin-top: 10px; background: #fffae5; border-top: 4px solid var(--ug-yellow); padding: 7px 12px; font-size: 13.5px; line-height: 1.35; }
  #legend { position: absolute; margin: 0; font-size: 13px; color: var(--ink); pointer-events: none; }
  #legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin: 0 5px 0 14px; }
  #legend i:first-child { margin-left: 0; }
  /* + and − on the map, as in the overview tool */
  #mapzoom { position: absolute; display: flex; flex-direction: column; gap: 4px; }
  #mapzoom button { width: 28px; height: 28px; padding: 0; font: 18px/1 var(--font-medium); border: 1px solid var(--ug-blue); border-radius: 0; background: #fff; color: var(--ug-blue); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  #mapzoom button:hover { background: var(--ug-blue-light); }
  #mapzoom button:disabled { opacity: .45; cursor: default; background: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="map"></canvas>
    <div id="mapzoom"><button id="mzin" title="Zoom in">+</button><button id="mzout" title="Zoom out">−</button></div>
    <div id="legend"><i style="background:#ffff00;border:1px solid #0004"></i>Selected<i style="background:rgba(242,140,0,.15);border:2px solid #f28c00"></i><span id="lg-cmp">Area to compare to</span></div>
    <div id="hint"></div></div>
  <div id="panel">
    <header><h1>Select by location</h1></header>
    <div class="body">
    <h2>Select features from</h2>
    <div id="layers">
      <button data-l="cities">Cities<small>points</small></button>
      <button data-l="rivers">Rivers<small>lines</small></button>
      <button data-l="states">States<small>polygons</small></button>
    </div>
    <h2>Where the features</h2>
    <table id="preds"></table>
    <h2>By comparing to the features from</h2>
    <div id="cmp">
      <button data-n="1">One area</button>
      <button data-n="2">Two areas</button>
      <button id="reset">Reset position</button>
    </div>
    <div id="count"></div>
    <div class="attn" id="attn"></div>
    <div id="info"></div>
      <footer class="credit">Hans Blomme · Dept. of History · GhentCDH · Ghent University · CC BY-SA 4.0<br>Vectors United States: Natural Earth (public domain)</footer>
    </div>
  </div>
</div>

    + (heads.length > 1 ? `<tr><th class="gp"></th>${heads.map(t => `<th>${t}</th>`).join("")}</tr>` : "") + PREDS.map(([p, name]) => {
    const on = state.ticked.includes(p);
    const cells = heads.map((t, d) => {
      if (!R) return `<td class="t no">·</td>`;
      const v = R[d][p], hit = on && v && (p !== "disjoint" || R.every(x => x.disjoint));
      return `<td class="t ${v ? "yes" : "no"}${hit ? " hit" : ""}">${v ? "true" : "false"}</td>`;
    }).join("");
    return `<tr><td><label class="chk"><input type="checkbox" data-p="${p}"${on ? " checked" : ""}> ${name}</label></td>${cells}</tr>`;
  }).join("");
  document.querySelectorAll("#preds input").forEach(c => c.onchange = () => {
    state.ticked = PREDS.map(q => q[0]).filter(p => p === c.dataset.p ? c.checked : state.ticked.includes(p)); refresh();
  });
  const sel = L.items.map((f, j) => isSelected(rels[j], state.ticked)), n = sel.filter(Boolean).length;
  document.getElementById("count").innerHTML = `Selected: <b>${n}</b> of ${L.items.length} features`;
  const info = document.getElementById("info");
  // contain ticked for points or lines (author, 2026-10-30): a point or a line can never contain an area, so say so instead of looking broken
  const noContain = L.type !== "polygon" && state.ticked.includes("contain") ? `<p>A ${L.type} can never contain an area, so contain selects nothing here.</p>` : "";
  // no feature under the mouse or clicked: say how to get the explanation (author 2026-11-16: the hover was not obvious)
  if (!R) info.innerHTML = `<b>Point at a feature</b><p>Point at a feature on the map to see here which predicates are true for it, and why it is selected or not. Click it to keep the explanation.</p>`
    + (noContain ? `<b>Contain</b>${noContain}` : `<b>Several predicates</b><p>When you tick several predicates, QGIS selects the features for which at least one of them is true.</p>`);
  else {
    const f = L.items[i], allDis = R.every(x => x.disjoint);
    const why = state.ticked.filter(p => p === "disjoint" ? allDis : R.some(x => x[p])).map(p => PREDS.find(q => q[0] === p)[1]);
    const lines = allDis ? [`${subject(L, f)} has no point in common with ${nd > 1 ? "either area" : "the area"}: only disjoint is true.`]
      : R.map((x, d) => `${subject(L, f)} ${(x.disjoint ? SAY.E : SAY[L.type][x.how]).replace("{S}", CMP[d].ref)}`);
    const last = sel[i] ? `Selected, because ${why.join(" and ")} ${why.length > 1 ? "are" : "is"} true.`
      : !state.ticked.length ? "Not selected: no predicate is ticked."
      : state.ticked.includes("disjoint") && R.some(x => x.disjoint) ? `Not selected: disjoint is not true for both areas${state.ticked.length > 1 ? ", and no other ticked predicate is true" : ""}.`
      : "Not selected: none of the ticked predicates is true.";
    info.innerHTML = `<b>${f.name} (${L.one})</b><p>${lines.join("</p><p>")}</p><p>${last}</p>`;
  }
  const attn = document.getElementById("attn");
  attn.hidden = nd < 2;
  attn.innerHTML = nd < 2 ? "" : `<b class="attnt">Disjoint with two areas</b>Disjoint selects only the features that are disjoint from both areas. For every other predicate, one area is enough.`;
  document.querySelectorAll("#cmp button[data-n]").forEach(b => b.classList.toggle("on", +b.dataset.n === nd));
  const home = state.off.slice(0, nd).every(o => !o[0] && !o[1]), rs = document.getElementById("reset");
  rs.disabled = home; rs.title = home ? (nd > 1 ? "The areas are in their own place" : "The area is in its own place") : "";
  document.getElementById("lg-cmp").textContent = nd > 1 ? "Areas to compare to" : "Area to compare to";
}
document.querySelectorAll("#layers button").forEach(b => b.onclick = () => { if (b.dataset.l !== state.layer) { state.layer = b.dataset.l; state.pick = state.hover = null; } refresh(); });
document.querySelectorAll("#cmp button[data-n]").forEach(b => b.onclick = () => { state.n = +b.dataset.n; refresh(); });
document.getElementById("reset").onclick = () => { state.off = [[0, 0], [0, 0]]; refresh(); };
function writeHash() {
  const L = LAYERS[state.layer], o = state.off.map(v => v.join(","));
  let h = `layer=${state.layer}&pred=${state.ticked.join(",")}`;
  if (state.n > 1) h += "&areas=2";
  if (o[0] !== "0,0") h += `&move1=${o[0]}`;
  if (state.n > 1 && o[1] !== "0,0") h += `&move2=${o[1]}`;
  if (state.pick !== null) h += `&pick=${slug(L.items[state.pick].name)}`;
  try { history.replaceState(null, "", "#" + h); } catch (e) { /* not allowed in some embeds */ }
}
function setHint() {
  const s = nCmp() > 1 ? "an orange area" : "the orange area";
  // "drag the map to pan" only when there is something to pan to, i.e. when zoomed in (author 2026-11-16)
  hint.textContent = state.drag ? "Drop it anywhere on the map" : `Drag ${s} · click a feature · scroll to zoom${state.z > 1 ? " · drag the map to pan" : ""}`;
}
function refresh() { compute(); updatePanel(); draw(); setHint(); writeHash(); }

// --- mouse: drag an area, pan the map, hover or click a feature ---
function mapPos(e) { const r = view.getBoundingClientRect(); return [state.c[0] + (e.clientX - r.left - box.x - box.w / 2) / box.k, state.c[1] - (e.clientY - r.top - box.y - box.h / 2) / box.k]; }
function inFrame(e) { const r = view.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; return x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h; }
function stateAt(p) {
  for (let i = CMP.length - 1; i >= 0; i--) { const d = CMP[i]; if (inside(p, d.rings) || d.E.some(([a, b]) => distSeg(p, a, b) * box.k < 6)) return i; }
  return -1;
}
function featureAt(p) {
  const L = LAYERS[state.layer]; let best = null, bd = Infinity;
  L.items.forEach((f, i) => {
    let d;
    if (L.type === "point") d = Math.hypot(p[0] - f.geom[0], p[1] - f.geom[1]) * box.k;
    else if (L.type === "line") d = Math.min(...parts(f.geom).map(([a, b]) => distSeg(p, a, b))) * box.k;
    else d = !apart([p[0], p[1], p[0], p[1]], f.bb) && inside(p, f.geom) ? 0 : Infinity;
    if (d < bd) { bd = d; best = i; }
  });
  return bd <= (L.type === "polygon" ? 0 : 9) ? best : null;
}
view.addEventListener("pointerdown", e => {
  if (e.target.closest("#mapzoom") || !inFrame(e)) return;
  const p = mapPos(e), i = stateAt(p);
  state.down = { x: e.clientX, y: e.clientY, p, moved: false };
  view.setPointerCapture(e.pointerId);
  if (i >= 0) { state.drag = { i, p, off: state.off[i].slice() }; view.classList.add("dragging"); }
  else if (state.z > 1) state.pan = { c: state.c.slice() };
});
view.addEventListener("pointermove", e => {
  const dn = state.down;
  if (dn && Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 4) dn.moved = true;
  if (state.drag) {
    if (!dn.moved) return;
    const dr = state.drag, p = mapPos(e);
    let o = clampOff(dr.i, [dr.off[0] + Math.round(p[0] - dr.p[0]), dr.off[1] + Math.round(p[1] - dr.p[1])]);
    if (Math.hypot(o[0], o[1]) * box.k < 10) o = [0, 0];   // snaps back into its own place
    if (String(o) !== String(state.off[dr.i])) { state.off[dr.i] = o; compute(); updatePanel(); draw(); }
    setHint(); return;
  }
  if (state.pan) {
    if (!dn.moved) return;
    state.c = [state.pan.c[0] - (e.clientX - dn.x) / box.k, state.pan.c[1] + (e.clientY - dn.y) / box.k];
    view.classList.add("dragging"); draw(); return;
  }
  const ok = inFrame(e) && !e.target.closest("#mapzoom"), p = mapPos(e), f = ok ? featureAt(p) : null, si = ok ? stateAt(p) : -1;
  view.classList.toggle("over-state", si >= 0); view.classList.toggle("over-feature", si < 0 && f !== null);
  if (f !== state.hover) { state.hover = f; updatePanel(); draw(); }
});
view.addEventListener("pointerup", e => {
  const dn = state.down;
  state.drag = state.pan = null; view.classList.remove("dragging");
  if (dn && !dn.moved) { state.pick = state.hover = inFrame(e) ? featureAt(mapPos(e)) : null; }
  state.down = null; refresh();
});
view.addEventListener("pointerleave", () => { if (!state.drag && !state.pan && state.hover !== null) { state.hover = null; updatePanel(); draw(); } });
function zoomAt(f, sx, sy) {   // zoom by factor f, keeping the map point under screen point (sx, sy) in place
  const r = view.getBoundingClientRect(), px = sx - r.left - box.x - box.w / 2, py = sy - r.top - box.y - box.h / 2;
  const mx = state.c[0] + px / box.k, my = state.c[1] - py / box.k;
  state.z *= f; clampView();
  state.c = [mx - px / box.k, my + py / box.k]; clampView(); draw();
}
view.addEventListener("wheel", e => {
  if (!inFrame(e)) return;
  e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX, e.clientY);
}, { passive: false });
const centre = () => { const r = view.getBoundingClientRect(); return [r.left + box.x + box.w / 2, r.top + box.y + box.h / 2]; };
document.getElementById("mzin").onclick = () => zoomAt(2, ...centre());
document.getElementById("mzout").onclick = () => zoomAt(0.5, ...centre());
window.addEventListener("hashchange", () => {
  const p = new URLSearchParams(location.hash.slice(1));
  if (LAYERS[p.get("layer")] && p.get("layer") !== state.layer) { state.layer = p.get("layer"); state.pick = null; }
  if (p.has("pred")) state.ticked = p.get("pred").split(",").filter(x => PREDS.some(q => q[0] === x));
  state.n = p.get("areas") === "2" ? 2 : 1;
  state.off = [offs(p.get("move1")), offs(p.get("move2"))]; clampAll();
  const k = slug(p.get("pick") || ""), j = LAYERS[state.layer].items.findIndex(f => slug(f.name) === k);
  state.pick = k && j >= 0 ? j : null;
  compute(); updatePanel(); draw();
});
let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(view);
refresh();
</script>
</body>
